<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="same-origin" />
  <title>Portal Admin</title>
  <link rel="stylesheet" href="styles.css?v=2" />
  <!-- Classic deferred scripts, run in order; each assigns only window.PA.<module>.
       Bump ?v= on a release so browsers don't mix old and new files. -->
  <script src="ui.js?v=2" defer></script>
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <!-- Login screen (shown when /admin/me returns 401) -->
  <section id="login" class="login hidden">
    <div class="login-card">
      <h1>Portal Admin</h1>
      <p>Sign in with Discord to manage personas, invites and access.</p>
      <a class="btn btn-primary" href="/admin/login">Sign in with Discord</a>
      <p id="login-error" class="error hidden" role="alert"></p>
    </div>
  </section>

  <!-- Main app shell (shown when authenticated) -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">portal<span class="brand-dim">/admin</span></div>

      <nav class="tabs" id="tabs" aria-label="Sections">
        <button type="button" class="tab" data-tab="personas">Personas</button>
        <button type="button" class="tab" data-tab="invites">Invites</button>
        <button type="button" class="tab" data-tab="roles">Access roles</button>
        <button type="button" class="tab" data-tab="audit">Audit</button>
        <button type="button" class="tab tab-super" data-tab="guilds">Guilds</button>
      </nav>

      <div class="spacer"></div>

      <div class="scope" id="scope">
        <label class="scope-label" for="guild-select">guild</label>
        <select id="guild-select" class="scope-select"></select>
        <span id="guild-static" class="scope-static hidden"></span>
      </div>

      <div class="user">
        <span id="user-name" class="user-name"></span>
        <span id="super-badge" class="badge badge-super hidden">super</span>
        <button type="button" id="logout-btn" class="btn btn-ghost btn-sm">Sign out</button>
      </div>
    </header>

    <main id="view" class="view"><!-- active tab rendered here --></main>
  </div>

  <!-- Right-side detail drawer (persona / mint / role editors) -->
  <div id="drawer-scrim" class="drawer-scrim hidden"></div>
  <aside id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true" tabindex="-1">
    <header class="drawer-head">
      <h2 id="drawer-title" class="drawer-title" tabindex="-1"></h2>
      <button type="button" id="drawer-close" class="btn btn-ghost btn-sm" aria-label="Close panel" title="Close (Esc)">✕</button>
    </header>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- Results and errors: errors stay until dismissed; the rest fade. -->
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
